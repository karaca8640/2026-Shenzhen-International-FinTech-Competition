name: refundpath
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: refundpath
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: refundpath
    volumes:
      - refundpath_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refundpath -d refundpath"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://refundpath:local-demo-only@postgres:5432/refundpath
      LLM_PROVIDER: fake
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://refundpath:local-demo-only@postgres:5432/refundpath
      LLM_PROVIDER: fake
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["8000"]
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports: ["127.0.0.1:3000:8080"]
volumes:
  refundpath_pg:
